<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Report Issue</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Submit Issue Report</h1>
        <p class="header-subtitle">Product ID: <span th:text="${productId}">POO1</span></p>
    </div>

    <div class="form-section">
        <form th:action="@{/submit-issue}" method="post">
            <input type="hidden" name="productId" th:value="${productId}">

            <label for="stageId">Select the stage with the error:</label>
            <select name="stageId">
                <option value="GENERAL">General Product Details</option> 
                <option th:each="stage : ${allStages}" 
                        th:value="${stage[0]}" 
                        th:text="${'Stage ' + stage[0] + (stage.length > 3 ? ' (' + stage[3] + ')' : '')}">
                </option>
            </select>

            <label for="issueType">Issue Type:</label>
            <select name="issueType" id="issueType">
                <option value="INCORRECT_DATA">Incorrect Data</option>
                <option value="MISSING_EVIDENCE">Missing Evidence</option>
                <option value="LOCATION_ERROR">Wrong Location</option>
                <option value="OTHER">Other</option>
            </select>

            <label for="description">Detailed Description:</label>
            <textarea name="description" id="description" rows="5" placeholder="Enter description" required></textarea>

            <div class="form-actions">
                <button type="submit">Submit Report</button>
                <a href="/" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
