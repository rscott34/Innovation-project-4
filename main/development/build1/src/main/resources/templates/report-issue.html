<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>soucr — Report Issue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">

    <!-- Navbar -->
    <nav class="top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div>
                <a href="/"><img th:src="@{/assets/favicon.png}" alt="soucr" class="h-8 w-auto"></a>
            </div>
            <div></div>
            <div class="flex items-center justify-end">
                <a href="/" class="px-4 py-2 text-sm font-semibold text-white hover:text-brand-400 transition-all">
                    <span class="text-brand-400">←</span> Back
                </a>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center gap-3 mb-2">
                <i class="fas fa-flag text-red-400"></i>
                <h1 class="text-2xl font-bold text-white">Submit Issue Report</h1>
            </div>
            <p class="text-gray-400 text-sm">Product ID: <span class="text-white font-medium" th:text="${productId}">P001</span></p>
        </div>

        <!-- Form -->
        <div class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden">
            <div class="flex items-center gap-3 px-6 py-4 border-b border-white/5">
                <i class="fas fa-triangle-exclamation text-amber-400"></i>
                <h2 class="font-semibold text-white">Report Details</h2>
            </div>

            <form th:action="@{/submit-issue}" method="post" class="p-6 space-y-5">
                <input type="hidden" name="productId" th:value="${productId}">

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Stage</label>
                    <select name="stageId" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 focus:outline-none text-sm">
                        <option value="GENERAL" class="bg-gray-900">General Product Details</option>
                        <option th:each="stage : ${allStages}"
                                th:value="${stage[0]}"
                                th:text="${'Stage ' + stage[0] + (stage.length > 3 ? ' (' + stage[3] + ')' : '')}"
                                class="bg-gray-900"></option>
                    </select>
                </div>
                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Issue Type</label>
                    <select name="issueType" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 focus:outline-none text-sm">
                        <option value="INCORRECT_DATA" class="bg-gray-900">Incorrect Data</option>
                        <option value="MISSING_EVIDENCE" class="bg-gray-900">Missing Evidence</option>
                        <option value="LOCATION_ERROR" class="bg-gray-900">Wrong Location</option>
                        <option value="OTHER" class="bg-gray-900">Other</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Description</label>
                    <textarea name="description" rows="5" placeholder="Describe the issue in detail..."
                              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none text-sm resize-none" required></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold transition-all">
                        Submit Report
                    </button>
                    <a href="/" class="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:text-white text-center font-semibold transition-all">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-16 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>

</body>
</html>
