<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Soucr — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">

    <!-- Navbar -->
    <nav class="sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div>
                <a href="/">
                    <img th:src="@{/assets/favicon.png}" alt="soucr" class="h-20 w-auto">
                </a>
            </div>
            <div></div> <!-- Empty middle column for spacing -->
            <div class="flex justify-end">
                <a href="/" class="px-4 py-2 text-sm font-semibold text-white hover:text-brand-400 transition-all">
                    <span class="text-brand-400">←</span> Back
                </a>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <main class="flex-1 flex items-center justify-center px-6 py-12">
        <div class="w-full max-w-sm">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-white tracking-tight mb-2">Verifier Login</h1>
                <p class="text-gray-400 text-sm">Sign in to access verification tools</p>
            </div>

            <div class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden">
                <div class="flex items-center gap-3 px-6 py-4 border-b border-white/5">
                    <i class="fas fa-lock text-brand-400"></i>
                    <h2 class="font-semibold text-white">Sign in</h2>
                </div>

                <form action="/login" method="post" class="p-6 space-y-4">
                    <div class="space-y-1">
                        <label class="text-xs text-gray-500 uppercase tracking-widest">Username</label>
                        <input type="text" name="username" placeholder="Enter username"
                               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-brand-500/50 transition-all text-sm" required/>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs text-gray-500 uppercase tracking-widest">Password</label>
                        <input type="password" name="password" placeholder="Enter password"
                               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-brand-500/50 transition-all text-sm" required/>
                    </div>
                    <!-- Error -->
                    <p th:if="${error}" class="text-red-400 text-sm" th:text="${error}"></p>
                    <button type="submit" class="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold transition-all">
                        Log in
                    </button>
                    <p class="text-center text-sm text-gray-500">
                        Don't have an account? 
                        <a href="/register" class="text-brand-400 hover:text-brand-500 font-semibold transition-all">Register</a>
                    </p>
                </form>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer class="border-t border-white/5 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>

</body>
</html>
