<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Soucr - Inbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">
    <!-- Navbar -->
    <nav class="top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div>
                <a href="/">
                    <img th:src="@{/assets/favicon.png}" alt="soucr" class="h-20 w-auto">
                </a>
            </div>
            <div></div>
            <div class="flex items-center justify-end">
                <a href="/" class="px-4 py-2 text-sm font-semibold text-white hover:text-brand-400 transition-all">
                    <span class="text-brand-400">←</span> Back
                </a>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-6 py-12">
        <div class="mb-8">
            <div class="flex items-center gap-3 mb-2">
                <i class="fas fa-inbox text-brand-400"></i>
                <h1 class="text-2xl font-bold text-white">Issue Reports</h1>
            </div>
            <p class="text-gray-400 text-sm">Review and resolve pending issue reports submitted by users.</p>
        </div>
        <!-- Empty State -->
        <div th:if="${reports.empty}" class="py-20 text-center">
            <i class="fas fa-inbox text-gray-700 text-5xl mb-4"></i>
            <p class="text-gray-400">No active reports to review.</p>
        </div>
        <div th:if="${!reports.empty}" class="space-y-4">
            <div th:each="report : ${reports}" class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden">
                <div class="flex items-center justify-between px-6 py-4 border-b border-white/5">
                    <div class="flex items-center gap-3">
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold"
                              th:classappend="${report.status == 'RESOLVED'} ? 'bg-brand-500/20 text-brand-400' : 'bg-amber-500/20 text-amber-400'"
                              th:text="${report.status}">PENDING</span>
                        <span class="text-white font-medium text-sm" th:text="${report.issueType}">Issue Type</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <a th:href="@{/edit-stage(stageId=${report.stageId})}"
                           class="px-3 py-1.5 rounded-lg text-xs text-gray-300 hover:text-white border border-white/10 transition-all">
                            <i class="fas fa-pen text-xs"></i> Edit Stage
                        </a>
                        <form th:action="@{/verifier/resolve}" method="post" th:if="${report.status == 'PENDING'}">
                            <input type="hidden" name="reportId" th:value="${report.id}">
                            <button type="submit" class="px-3 py-1.5 rounded-lg text-xs font-semibold bg-brand-500 hover:bg-brand-600 text-white transition-all">
                                <i class="fas fa-check text-xs"></i> Resolve
                            </button>
                        </form>
                    </div>
                </div>
                <div class="p-6 grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Product ID</p>
                        <p class="text-white font-medium" th:text="${report.productId}"></p>
                    </div>
                    <div>
                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Stage ID</p>
                        <p class="text-white font-medium" th:text="${report.stageId}"></p>
                    </div>
                    <div class="sm:col-span-3">
                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Issue Type</p>
                        <p class="text-gray-300" th:text="${report.issueType}"></p>
                    </div>
                    <div class="sm:col-span-3">
                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Description</p>
                        <p class="text-gray-300" th:text="${report.userDescription}"></p>
                    </div>
                <div class="sm:col-span-3">
                        <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Action</p>
                        <p class="text-gray-300" th:text="${report.action}"></p>
                    </div>
                
                </div>
            </div>
        </div>
    </main>
   
    <footer class="border-t border-white/5 mt-16 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>
</body>
</html>
