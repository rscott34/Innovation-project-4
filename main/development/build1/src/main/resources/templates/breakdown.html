<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Breakdown</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <a href="/"><button>Home</button></a>
            <a href="/questions/generate"><button>Question</button></a>
        </div>
        <div class="navbar-right">
            <span th:if="${session.points != null}" class="score-display">
                Score: <span th:text="${session.points}">0</span>
            </span>
            <span th:if="${role == 'verifier'}" >
                [Verifier Mode]
            </span>
        </div>
    </div>

    <div class="header">
        <h1>Ingredient Breakdown</h1>
        <p>P100</span></p>
    </div>

    <div class="result-section">
        <div class="feedback-message">
            <span>Visualizing component percentages from the database.</span>
        </div>

        <div th:if="${#lists.isEmpty(shares)}" class="info">
            <span class="label"><b>Notice:</b></span>
            <span class="value">No ingredient data available for this product.</span>
        </div>

        <div th:if="${not #lists.isEmpty(shares)}">
            <canvas id="ingredientChart"></canvas>
        </div>

        <!-- Pass data to JS via hidden fields -->
        <div id="chart-data">
            <span th:each="share : ${shares}"
                  th:data-label="${share[2]}"
                  th:data-value="${share[4]}"
                  th:data-origin="${share[1]}"
                  th:data-country="${share[3]}"
                  class="chart-item">
            </span>
        </div>

        <div class="passport-link">
            <a href="/"><button type="button">Back to Search</button></a>
        </div>
    </div>

    <footer>
        <p>This is an educational prototype, do not trust the official certifications for synthetic data</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script th:src="@{/piechart.js}"></script>
</body>
</html>
