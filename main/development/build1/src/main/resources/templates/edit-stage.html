<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Stage</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="header">
        <h1>Edit Timeline Stage</h1>
    </div>
    <div class="edit-form">
        <p>
            <b>Editing Stage ID:</b> <span class="highlight" th:text="${stageId}">S001</span>
        </p>
        <form action="/update-stage" method="post">
            <input type="hidden" name="stageId" th:value="${stageId}" />
            <label>Update Location:</label>
            <input type="text" name="newLocation" placeholder="Enter new location/materials..." required />
            <div class="form-actions">
                <button type="submit">Save Changes</button>
                <a href="/" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
