<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>soucr — Edit Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">

    <!-- Navbar -->
    <nav class="top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div>
                <a href="/">
                    <img th:src="@{/assets/favicon.png}" alt="soucr" class="h-20 w-auto">
                </a>
            </div>
            <div></div>
            <div class="flex items-center justify-end">
                <form action="/submit" method="post">
                    <input type="hidden" name="questionGenerated" value="false"/>
                    <input type="hidden" name="userAnswer" value=""/>
                    <input type="hidden" name="userInput" th:value="${product.productId}"/>
                    <button type="submit" class="px-4 py-2 text-sm font-semibold text-white hover:text-brand-400 transition-all">
                        <span class="text-brand-400">←</span> Back
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-12">

        <!-- Header -->
        <div class="mb-8">
            <div class="flex items-center gap-3 mb-2">
                <i class="fas fa-pen text-brand-400"></i>
                <h1 class="text-2xl font-bold text-white">Edit Product</h1>
            </div>
            <p class="text-gray-400 text-sm">Editing Product ID: <span class="text-white font-medium" th:text="${product.productId}">P100</span></p>
        </div>

        <!-- Form -->
        <div class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden">
            <div class="flex items-center gap-3 px-6 py-4 border-b border-white/5">
                <i class="fas fa-box text-brand-400"></i>
                <h2 class="font-semibold text-white">Product Information</h2>
            </div>

            <form action="/update-product" method="post" class="p-6 space-y-5">
                <input type="hidden" name="productId" th:value="${product.productId}"/>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Name</label>
                    <input type="text" name="newName" th:value="${product.name}" required
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-brand-500/50 transition-all text-sm"/>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Category</label>
                    <select name="newCategory" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 focus:outline-none text-sm">
                        <option th:each="cat : ${categories}"
                                th:value="${cat}"
                                th:text="${cat}"
                                th:selected="${cat == product.category}"
                                class="bg-gray-900"></option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Brand</label>
                    <input type="text" name="newBrand" th:value="${product.brand}" required
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none focus:border-brand-500/50 transition-all text-sm"/>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Description</label>
                    <textarea name="newDescription" rows="4" th:text="${product.description}"
                              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white focus:outline-none text-sm resize-none"></textarea>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-1 py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold transition-all">
                        Save Changes
                    </button>
                    <a href="/" class="flex-1 py-3 rounded-xl border border-white/10 text-gray-300 hover:text-white text-center font-semibold transition-all">
                        Cancel
                    </a>
                </div>
            </form>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-16 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>

</body>
</html>
