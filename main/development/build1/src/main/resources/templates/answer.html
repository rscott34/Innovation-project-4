<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>soucr — Result</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">

    <!-- Navbar -->
    <nav class="top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div>
                <a href="/"><img th:src="@{/assets/favicon.png}" alt="soucr" class="h-8 w-auto"></a>
            </div>
            <div class="flex items-center justify-center gap-1">
                <a href="/" class="px-4 py-2 rounded-lg text-sm text-gray-300 hover:text-white hover:bg-white/10 transition-all">Home</a>
                <a href="/questions/generate" class="px-4 py-2 rounded-lg text-sm text-gray-300 hover:text-white hover:bg-white/10 transition-all">Next Question</a>
            </div>
            <div class="flex items-center justify-end">
                <span th:if="${session.points != null}" class="flex items-center gap-2 px-3 py-1 rounded-full bg-brand-500/20 border border-brand-500/30 text-brand-400 text-sm font-semibold">
                    <i class="fas fa-star text-xs"></i>
                    <span th:text="${session.points}">0</span> pts
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-16 text-center">

        <!-- Result Icon -->
        <div class="mb-6">
            <div th:if="${isCorrect}" class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-brand-500/20 border border-brand-500/30 mb-4">
                <i class="fas fa-check text-brand-400 text-2xl"></i>
            </div>
            <div th:if="${!isCorrect}" class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-red-500/20 border border-red-500/30 mb-4">
                <i class="fas fa-times text-red-400 text-2xl"></i>
            </div>
            <h1 class="text-3xl font-bold text-white mb-2" th:text="${resultMessage}">Result</h1>
            <p class="text-gray-400" th:text="${feedback}">Feedback</p>
        </div>

        <!-- Answer Card -->
        <div class="rounded-2xl bg-white/5 border border-white/10 overflow-hidden mb-6 text-left">
            <div class="p-6 space-y-4">
                <div>
                    <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Your Answer</p>
                    <p class="text-white font-medium" th:text="${userAnswer}"></p>
                </div>
                <div th:if="${isCorrect == false}" class="border-t border-white/5 pt-4">
                    <p class="text-xs text-gray-500 uppercase tracking-widest mb-1">Correct Answer</p>
                    <p class="text-brand-400 font-medium" th:text="${correctAnswer}"></p>
                </div>
            </div>
        </div>

        <!-- View Passport Button -->
        <form action="/submit" method="post">
            <input type="hidden" name="questionGenerated" value="false">
            <input type="hidden" name="userAnswer" value="">
            <input type="hidden" name="userInput" th:value="${passport}"/>
            <button type="submit" class="w-full py-3.5 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold transition-all">
                View Product Passport
            </button>
        </form>

    </main>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-16 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>

</body>
</html>
