<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><title>System History</title><link rel="stylesheet" th:href="@{/style.css}"></head>
<body style="padding: 20px;">
    <h2>Database Change Log History</h2>
    <a href="/"><button>Back to Search</button></a>
    <br/><br/>
    <table border="1" style="width: 100%; border-collapse: collapse; padding: 5px;">
        <tr style="background-color: #ddd;">
            <th>Entity Type</th>
            <th>Entity ID</th>
            <th>Changed By</th>
            <th>Timestamp</th>
            <th>Change Summary</th>
        </tr>
        <tr th:each="log : ${logs}">
            <td th:text="${log.entityType}" style="padding: 5px;"></td>
            <td th:text="${log.entityId}" style="padding: 5px;"></td>
            <td th:text="${log.changedBy}" style="padding: 5px;"></td>
            <td th:text="${log.timestamp}" style="padding: 5px;"></td>
            <td th:text="${log.changeSummary}" style="padding: 5px;"></td>
        </tr>
    </table>
</body>
</html>
