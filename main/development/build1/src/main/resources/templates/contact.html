<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>soucr — Contact Us</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                        }
                    },
                    fontFamily: {
                        sans: ['DM Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="min-h-screen text-gray-100" style="background: radial-gradient(ellipse at top left, rgba(34,197,94,0.15) 0%, transparent 50%), radial-gradient(ellipse at bottom right, rgba(34,197,94,0.08) 0%, transparent 50%), #0a0f0a;">
    <!-- Navbar -->
    <nav class="sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 h-16 grid grid-cols-3 items-center">
            <div class="flex items-center gap-3">
                <a href="/"><img th:src="@{/assets/favicon.png}" alt="soucr" class="h-8 w-auto"></a>
            </div>
            <div class="flex justify-center">
                <a href="/" class="px-4 py-2 rounded-lg text-sm text-gray-300 hover:text-white hover:bg-white/10 transition-all">
                    <i class="fas fa-arrow-left text-xs mr-1"></i> Back
                </a>
            </div>
            <div class="flex justify-end">
                <span th:if="${role == 'guest'}">
                    <a href="/login" class="px-4 py-2 text-sm font-semibold text-white hover:text-brand-400 transition-all">
                        Login <span class="text-brand-400">→</span>
                    </a>
                </span>
                <span th:if="${role == 'verifier'}" class="flex items-center gap-3">
                    <span class="px-3 py-1 rounded-full bg-brand-500/20 border border-brand-500/30 text-brand-400 text-xs font-semibold">
                        Verifier
                    </span>
                    <a href="/logout" class="text-sm text-gray-300 hover:text-white transition-all">Logout</a>
                </span>
            </div>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-16">

        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-4xl font-bold text-white mb-3 tracking-tight">
                Contact <span class="text-brand-400">Us</span>
            </h1>
            <p class="text-gray-400">
                Have a question or want to get in touch? We'd love to hear from you.
            </p>
        </div>

        <!-- Contact Form -->
        <div class="rounded-2xl bg-white/5 border border-white/10 card-glow overflow-hidden">
            <div class="flex items-center gap-3 px-6 py-4 border-b border-white/5">
                <i class="fas fa-paper-plane text-brand-400"></i>
                <h2 class="font-semibold text-white">Send a message</h2>
            </div>

            <form id="contactForm" class="p-6 space-y-5" onsubmit="handleSubmit(event)">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs text-gray-500 uppercase tracking-widest">First Name</label>
                        <input type="text" name="firstName" placeholder="Jane"
                               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-brand-500/50 transition-all text-sm"/>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs text-gray-500 uppercase tracking-widest">Last Name</label>
                        <input type="text" name="lastName" placeholder="Smith"
                               class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-brand-500/50 transition-all text-sm"/>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Email</label>
                    <input type="email" name="email" placeholder="jane@example.com"
                           class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none focus:border-brand-500/50 transition-all text-sm"/>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Subject</label>
                    <select name="subject" class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-gray-300 focus:outline-none text-sm">
                        <option value="" class="bg-gray-900">Select a subject...</option>
                        <option value="product_query" class="bg-gray-900">Product Query</option>
                        <option value="report_issue" class="bg-gray-900">Report an Issue</option>
                        <option value="partnership" class="bg-gray-900">Partnership</option>
                        <option value="other" class="bg-gray-900">Other</option>
                    </select>
                </div>

                <div class="space-y-1">
                    <label class="text-xs text-gray-500 uppercase tracking-widest">Message</label>
                    <textarea name="message" rows="5" placeholder="Tell us how we can help..."
                              class="w-full px-4 py-3 rounded-xl bg-white/5 border border-white/10 text-white placeholder-gray-600 focus:outline-none text-sm resize-none"></textarea>
                </div>

                <button type="submit" class="w-full py-3 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-semibold transition-all">
                    Send Message
                </button>
            </form>
        </div>

    </main>

    <!-- Success Banner -->
    <div id="successBanner" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-50 flex items-center gap-4 px-6 py-4 rounded-2xl bg-gray-900 border border-brand-500/40 shadow-xl">
        <i class="fas fa-check text-brand-400"></i>
        <div>
            <p class="text-white font-semibold text-sm">Message sent!</p>
            <p class="text-gray-400 text-xs">We'll get back to you within 2 business days.</p>
        </div>
        <button onclick="document.getElementById('successBanner').classList.add('hidden')" class="ml-4 text-gray-500 hover:text-white">
            <i class="fas fa-times text-xs"></i>
        </button>
    </div>

    <script>
        function handleSubmit(e) {
            e.preventDefault();
            document.getElementById('contactForm').reset();
            const banner = document.getElementById('successBanner');
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 5000);
        }
    </script>

    <!-- Footer -->
    <footer class="border-t border-white/5 mt-16 py-8 text-center">
        <p class="text-xs text-gray-600">This is an educational prototype — do not trust official certifications for synthetic data.</p>
    </footer>

</body>
</html>
