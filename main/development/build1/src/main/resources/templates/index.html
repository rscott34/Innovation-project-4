<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tracer Input</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
    <div class="header">
        <h1>Enter Product ID</h1>
    </div>
    <div class="search">
        <form action="/submit" method="post">
            <input type="text" name="userInput" placeholder="e.g. P100" required />
            <button type="submit">Send</button>
        </form>
    </div>
    <div class="product-card">
        <div class="card-body">
            <div class="info">
                <span class="label"> <b>Product ID:</b></span>
                <span class="value" th:text="${productId}">P100</span>
            </div>
            <div class="info">
                <span class="label"><b>Name:</b></span>
                <span class="value" th:text="${name}">P100</span>
            </div>
            <div class="info">
                <span class="label"><b>Category:</b></span>
                <span class="value" th:text="${category}">P100</span>
            </div>
            <div class="info">
                <span class="label"><b>Brand:</b></span>
                <span class="value" th:text="${brand}">P100</span>
            </div>
            <div class="info">
                <span class="label"><b>Description:</b></span>
                <span class="value" th:text="${description}">P100</span>
            </div>

        </div>
    </div>

</body>
</html>
