<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Verify Claim</title>
    <link rel="stylesheet" th:href="@{/style.css}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <h1>Verify Claim</h1>
    </div>
    <div class="form-section">
        <p>
            <b>Claim ID:</b> <span class="highlight" th:text="${claimId}">C001</span>
        </p>
        <form th:action="@{/submit-verification}" method="post">
            <input type="hidden" name="claimId" th:value="${claimId}">
            <input type="hidden" name="evidenceId" th:value="${evidenceId}">
            <label><strong>Select Evidence File:</strong></label>
            <select name="evidenceFile">
                <option value="none">None (No evidence attached)</option>
                <option th:each="ev : ${evidenceList}"
                        th:value="${ev.fileRef}"
                        th:text="${ev.fileRef}">
                </option>
            </select>
            <label><strong>Explanation:</strong></label>
            <textarea name="explanation" rows="4" placeholder="Provide a reason for your verification decision..."></textarea>

            <div class="form-actions">
                <button type="submit">Update Verification</button>
                <a href="/" class="cancel-link">Cancel</a>
            </div>
        </form>
    </div>
    <footer>
        <p>This is an educational prototype, do not trust the official certifications for synthetic data</p>
    </footer>
</body>
</html>
