name: Run tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
    
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run Maven tests
        working-directory: main/development/build1
        run: ./mvnw test
      