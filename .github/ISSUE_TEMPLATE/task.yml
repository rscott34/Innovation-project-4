name: Task
description: Sprint task for Traceability Quest project
labels: ["task"]

body:
  - type: textarea
    id: task_description
    attributes:
      label: Task Description
      description: What needs to be done?
      placeholder: |
        Describe the task clearly and concisely.
        Reference relevant requirements or sprint goals.
    validations:
      required: true
  
  - type: textarea
    id: user_story
    attributes:
      label: User Story
      description: Task from User's perspective
      placeholder: |
        As a [User Type],
        I want to [Action],
        so that [Value / Goal].
    
  - type: dropdown
    id: role
    attributes:
      label: Primary Role Responsible
      options:
        - Project Lead
        - Technical Lead
        - Software Developer
        - Data Lead
        - UI/UX Designer
        - QA & Testing
        - DevOps
        - Documentation & Comms
    validations:
      required: true

  

  - type: textarea
    id: role_expectations
    attributes:
      label: Role-Specific Expectations
      placeholder: |
        Project Lead: planning, coordination, risk tracking
        Technical Lead: architecture and integration
        Developer: feature implementation and tests
        Data Lead: dataset design and validation
        UI/UX: user flows and accessibility
        QA: test cases and defect tracking
        DevOps: CI/CD and deployment
        Docs: reports and demo narrative

  - type: dropdown
    id: priority
    attributes:
      label: Priority (MoSCoW)
      options:
        - Must
        - Should
        - Could
    validations:
      required: true
  
  
  - type: textarea
    id: priority_rationale
    attributes:
      label: Priority Rationale
      description: Why is this a priority for the current sprint?

  - type: dropdown
    id: sprint
    attributes:
      label: Sprint
      options:
        - Sprint 1
        - Sprint 2
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria (What must it do?)
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
    validations:
      required: true
  
  - type: checkboxes
    id: definition_of_done
    attributes:
      label: Definition of Done (Mandatory)
      description: This task cannot be moved to "Done" unless all items are checked
      options:
        - label: Code is complete and follows the system architecture
        - label: Automated tests (min. 5 for CW1) pass and E2E tests are documented
        - label: Decision log and software/data inventory are updated
        - label: Code reviewed by Technical Lead or peer (quality + AI compliance)
